name: Docker image

# The Oracle VM has 1 GB RAM, too little to build next to MetalFlow.
# Build here and publish to GHCR; the server only pulls (deploy.sh).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image
  cancel-in-progress: true

jobs:
  image:
    name: Build and push ghcr.io image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            VITE_WEB_PUSH_PUBLIC_KEY=${{ vars.VITE_WEB_PUSH_PUBLIC_KEY }}
          tags: |
            ghcr.io/myminimuffin/jnm-coaching:latest
            ghcr.io/myminimuffin/jnm-coaching:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
