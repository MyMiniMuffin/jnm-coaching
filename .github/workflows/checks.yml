name: JNM Coaching checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests-and-build:
    name: Tests and production build (Node 22)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Node version
        run: node -v
      - run: npm ci --no-audit --no-fund
      # apt in --with-deps sometimes hangs on the runner mirror until the job times out.
      # Give each attempt 3 minutes and try three times.
      - name: Install Chromium for Playwright
        run: |
          for attempt in 1 2 3; do
            # A killed attempt can leave dpkg half-configured, so repair it before retrying.
            [ "$attempt" -gt 1 ] && { sudo dpkg --configure -a || true; }
            timeout -k 10 180 npx playwright install --with-deps chromium && exit 0
            echo "playwright install attempt $attempt failed or timed out"
          done
          exit 1
      - run: npm test
      - run: npm run build
      - name: Validate Xcode Cloud script
        run: sh -n ios/App/ci_scripts/ci_post_clone.sh

