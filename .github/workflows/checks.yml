name: JNM Coaching checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests-and-build:
    name: Tests and production build (Node 22)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Node version
        run: node -v
      - run: npm ci --no-audit --no-fund
      # No --with-deps: it installs system packages through apt, and the Ubuntu archive
      # sometimes returns 503 or hangs. The ubuntu-24.04 image already has the libraries
      # headless Chromium needs. The browser download from the Playwright CDN is retried.
      - name: Install Chromium for Playwright
        run: |
          for attempt in 1 2 3; do
            timeout -k 10 180 npx playwright install chromium && exit 0
            echo "playwright install attempt $attempt failed or timed out"
          done
          exit 1
      - run: npm run build
      - name: Run tests
        run: |
          non_wave=()
          for f in tests/*.cjs tests/*.mjs; do
            [ "$f" = "tests/wave-behavior.mjs" ] || non_wave+=("$f")
          done
          node --test "${non_wave[@]}"
          node --test tests/wave-behavior.mjs
      - name: Validate Xcode Cloud script
        run: sh -n ios/App/ci_scripts/ci_post_clone.sh

